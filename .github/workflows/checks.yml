name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/prepare_workspace.py --demo
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/test_workbench_progress.cjs
      - run: python scripts/verify_study_workspace.py
