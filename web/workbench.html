<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>全站卡片工作台 · CodeBrick</title><link rel="stylesheet" href="workbench.css"><script src="workbench-progress.js" defer></script><script src="workbench.js" defer></script></head>
<body><header class="top"><a href="index.html" class="brand">CODEBRICK <span>全站卡片</span></a><div class="tools"><button id="exportState">备份进度</button><button id="chooseImport" type="button">恢复进度</button><input id="importState" type="file" accept="application/json,.json" hidden></div></header>
<div id="storageWarning" class="notice" role="alert" hidden><span id="storageMessage"></span> <button id="exportRaw" hidden>下载损坏的原始记录</button> <button id="resetState" hidden>重置本机记录</button></div><div id="notice" role="status" class="notice">正在载入全站目录…</div><div class="layout"><aside><div class="rail-heading"><span class="eyebrow">四科 · 全部文章</span><strong id="inventoryCount">—</strong></div><label for="subject">科目</label><select id="subject"><option value="all">全部科目</option><option value="os">操作系统</option><option value="co">计算机组成原理</option><option value="cn">计算机网络</option><option value="ds">数据结构</option></select><label for="search">查找文章</label><input id="search" type="search" placeholder="文章标题 / 关键词"><div id="articleList" class="article-list" aria-label="文章列表"></div></aside>
<main id="main"><div class="article-heading"><div><div class="eyebrow" id="subjectLabel">等待载入</div><h1 id="articleTitle">全站记忆卡片工作台</h1></div><a id="sourceLink" target="_blank" rel="noopener noreferrer" hidden>查看原文 ↗</a></div><div id="articleStats" class="stats"></div><p class="boundary">所有内容均为待审候选。复习评分只记录你的记忆情况，不代表知识正确性或 408 验收通过。图片、交互和原题的未核范围请查看来源与待核问题。</p>
<div class="filters"><div><label for="section">章节</label><select id="section"><option value="all">全部章节</option></select></div><div><label for="pool">候选类型</label><select id="pool"><option value="all">精编优先 + 机器候选</option><option value="curated">仅精编候选</option><option value="atomic">仅机器候选</option></select></div><label class="check"><input type="checkbox" id="dueOnly">仅看待复习</label></div>
<section class="study" aria-labelledby="cardQuestion"><div class="card-top"><span id="cardKind" class="badge">待审候选</span><span id="position">0 / 0</span></div><p id="cardContext" class="context"></p><h2 id="cardQuestion">从左侧选择文章</h2><div id="assumptions"></div><button id="flip" class="primary" disabled>显示答案 <kbd>空格</kbd></button><div id="answerBox" hidden><div class="answer-label">参考答案 · 待独立核验</div><pre id="cardAnswer"></pre><div id="sourceNotes" class="context"></div><div class="ratings" aria-label="自评记忆情况"><button data-rating="again">不会 · 稍后</button><button data-rating="hard">模糊 · 1 天</button><button data-rating="good">记住 · 递增</button><button data-rating="easy">熟练 · 递增</button></div></div><div class="card-bottom"><button id="previous" disabled>← 上一张</button><span id="dueStatus" class="context"></span><button id="next" disabled>下一张 →</button></div></section>
<details id="sourceDetails"><summary>本章来源单元与待核问题 <span id="sourceCount"></span></summary><p class="context">这里显示缓存解析文本，图示与动态内容可能未完整提取；不等于原文完整副本。引用导航不是知识覆盖证明。</p><div id="issues"></div><div id="sourceUnits"></div></details><section class="notes"><label for="articleNotes">我的文章笔记（仅保存在本机，可通过备份导出）</label><textarea id="articleNotes" rows="4" maxlength="12000" placeholder="记录疑问、错因、补充模型与推导…"></textarea><details id="noteConflictDetails" hidden><summary>本篇有不同版本的笔记，已保留供合并</summary><div id="noteConflicts"></div></details><p id="saveStatus" class="context" role="status"></p></section></main></div></body></html>
